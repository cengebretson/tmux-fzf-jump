name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        env:
          GH_TOKEN: ${{ github.token }}
          FZF_VERSION: 0.73.1
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux shellcheck
          gh release download "v${FZF_VERSION}" \
            --repo junegunn/fzf \
            --pattern "fzf-${FZF_VERSION}-linux_amd64.tar.gz" \
            --output /tmp/fzf.tar.gz
          sudo tar -xzf /tmp/fzf.tar.gz -C /usr/local/bin fzf
          fzf --version

      - name: Run smoke checks
        run: tests/check.sh
